<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lauren Santana | Designer gráfico e web</title>
  <!-- Fonte Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow-color: rgb(83, 39, 243);
      --glow-spread-color: rgba(193, 171, 241, 0.781);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }
    /* Vídeo de fundo */
    video#bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #000;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 50px 45px;
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 550px;
      width: 90%;
    }
    h1 {
      font-weight: 700;
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    p {
      font-weight: 300;
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 30px;
    }
    /* Container dos botões */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    /* Botão Principal (Portfólio) */
    .glow-button {
      background: linear-gradient(-45deg, #4e00c2, #3d5eff, #7847b6, #3d5eff);
      background-size: 800% 400%;
      padding: 18px 35px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      transition: all 0.5s;
      animation: gradient 10s infinite cubic-bezier(.62, .28, .23, .99) both;
      border: none;
      box-shadow: 0 0 0 transparent;
    }
    .glow-button:hover {
      background-image: linear-gradient(to right, #7649e9 0%, #0052fa 100%);
      box-shadow: 0 0 5em 0.0001em var(--glow-color),
                  0 0 2em 0.2em var(--glow-spread-color),
                  inset 0 0 .5em .5em var(--glow-color);
      cursor: pointer;
      transform: translateY(-2px);
    }
    @keyframes gradient {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }
    /* Botões Secundários */
    .secondary-button {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(5px);
      padding: 12px 25px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .secondary-button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transform: translateY(-1px);
    }
    /* Responsivo */
    @media (max-width: 480px) {
      .container {
        padding: 40px 35px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .glow-button {
        font-size: 1rem;
        padding: 16px 30px;
      }
      .secondary-button {
        font-size: 0.9rem;
        padding: 11px 22px;
      }
    }
  </style>
  <script defer data-domain="santanalauren.github.io/ssantanadesign" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <!-- Vídeo de fundo -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Seu navegador não suporta vídeos HTML5.
  </video>
  <!-- Conteúdo -->
  <div class="container">
    <h1>Talvez isso seja exatamente o que você estava procurando</h1>
    <p>Confira meus trabalhos ou fale comigo:</p>
    
    <div class="buttons-container">
      <!-- 1. WhatsApp -->
      <a class="secondary-button" href="https://wa.me/553173163304?text=Olá,%20quero%20falar%20sobre%20um%20projeto%20de%20design!" target="_blank">
        Vamos conversar sobre seu projeto
      </a>
      
      <!-- 2. Trabalhos recentes -->
      <a class="secondary-button" href="https://drive.google.com/file/d/1JmZHJ53rZxODeFyc07VaTgE0Nm__DnWX/view?usp=drive_link" target="_blank">
        Ver trabalhos recentes
      </a>
      
      <!-- 3. Portfólio -->
      <a class="glow-button" href="https://drive.google.com/file/d/1mfyKIYCOynRcFQYHYKonYdfHoZ4nU9hO/view" target="_blank">
        Explorar portfólio
      </a>
    </div>
  </div>
</body>
</html>
